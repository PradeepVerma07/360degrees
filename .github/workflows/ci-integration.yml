name: CI - Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysql -h127.0.0.1 -uroot -proot -e 'SELECT 1' && break || sleep 2
          done

      - name: Create test database and apply migrations
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ci360_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cat database/migrations/20260813_add_responsibility_key.sql | mysql -h127.0.0.1 -uroot -proot ci360_test

      - name: Start server
        working-directory: server
        run: |
          export DB_HOST=127.0.0.1
          export DB_USER=root
          export DB_PASSWORD=root
          export DB_NAME=ci360_test
          export DB_PORT=3306
          node src/index.js &
          echo $! > ../server.pid

      - name: Wait for server health
        run: |
          for i in {1..40}; do
            if curl -sSf http://localhost:4000/api/health | grep -q '"ok":true'; then
              echo "server ready"; break
            fi
            sleep 2
          done

      - name: Run integration test
        working-directory: server
        env:
          CI360_API_URL: http://localhost:4000
        run: npm run test:integration

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi || true